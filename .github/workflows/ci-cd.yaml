name: CI/CD pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.set_images.outputs.backend }}
      frontend: ${{ steps.set_images.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pdf-extractor-backend:latest
            ghcr.io/${{ github.repository_owner }}/pdf-extractor-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pdf-extractor-frontend:latest
            ghcr.io/${{ github.repository_owner }}/pdf-extractor-frontend:${{ github.sha }}

      - name: Set image outputs
        id: set_images
        run: |
          echo "backend=ghcr.io/${{ github.repository_owner }}/pdf-extractor-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "frontend=ghcr.io/${{ github.repository_owner }}/pdf-extractor-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Kubernetes (main only)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig or create Kind cluster
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -n "$KUBE_CONFIG_DATA" ]; then
            echo "Using provided KUBE_CONFIG_DATA."
            mkdir -p $HOME/.kube
            echo "$KUBE_CONFIG_DATA" | base64 --decode > $HOME/.kube/config
          else
            echo "KUBE_CONFIG_DATA is missing. Falling back to an ephemeral Kind cluster for dry-run testing."
            curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
            chmod +x ./kind
            ./kind create cluster
          fi

      - name: Apply manifests
        run: |
          # Apply only production manifests, ignoring kind-config and example pods/replicasets which cause errors
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Update Deployment images and wait for rollouts
        run: |
          kubectl set image deployment/pdf-extractor-backend backend=${{ needs.build-and-push.outputs.backend }} --record
          kubectl set image deployment/pdf-extractor-frontend frontend=${{ needs.build-and-push.outputs.frontend }} --record
          kubectl rollout status deployment/pdf-extractor-backend --timeout=120s
          kubectl rollout status deployment/pdf-extractor-frontend --timeout=120s

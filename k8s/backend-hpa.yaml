apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pdf-extractor-backend-hpa
  namespace: default
spec:
  # The deployment we want to scale
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pdf-extractor-backend
  
  # Minimum and maximum number of replicas
  minReplicas: 2
  maxReplicas: 10
  
  # Metrics used to determine when to scale
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        # Scale up if average CPU utilization exceeds 70%
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        # Scale up if average Memory utilization exceeds 80%
        averageUtilization: 80

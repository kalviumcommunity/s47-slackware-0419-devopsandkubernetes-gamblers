apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pdf-extractor-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: pdf.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pdf-extractor-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pdf-extractor-backend
                port:
                  number: 8000

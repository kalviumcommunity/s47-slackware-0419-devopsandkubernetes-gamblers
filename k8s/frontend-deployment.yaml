apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-extractor-frontend
  labels:
    app: pdf-extractor-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-extractor-frontend
  template:
    metadata:
      labels:
        app: pdf-extractor-frontend
    spec:
      containers:
        - name: frontend
          image: pdf-extractor-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: VITE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: pdf-extractor-config
                  key: VITE_API_URL
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          # Nginx static serving is very lightweight.
          resources:
            requests:
              # Minimal CPU needed to serve static assets.
              cpu: "50m"
              # 64Mi is enough for the Nginx process and small cache.
              memory: "64Mi"
            limits:
              # Limit ensures it doesn't burst beyond what's reasonable for a static server.
              cpu: "100m"
              # Prevents memory leaks in the container from affecting the node.
              memory: "128Mi"


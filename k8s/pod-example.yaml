apiVersion: v1
kind: Pod
metadata:
  name: standalone-nginx
  labels:
    app: standalone-nginx
spec:
  containers:
    - name: nginx
      image: nginx:1.25-alpine
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5

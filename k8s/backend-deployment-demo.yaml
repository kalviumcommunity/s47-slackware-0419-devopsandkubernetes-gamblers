apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-extractor-backend-demo
  labels:
    app: pdf-extractor-backend-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pdf-extractor-backend-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: pdf-extractor-backend-demo
    spec:
      containers:
        - name: backend
          image: nginx:1.25-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-extractor-backend
  labels:
    app: pdf-extractor-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pdf-extractor-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: pdf-extractor-backend
    spec:
      containers:
        - name: backend
          image: pdf-extractor-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: pdf-extractor-config
                  key: APP_ENV
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: pdf-extractor-config
                  key: APP_VERSION
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # Use development-friendly settings here so mounted code works
    environment:
      - APP_ENV=development
      - APP_VERSION=1.0.0
      - DEV_MODE=true
    volumes:
      - .:/app:rw
    # Mounting the host directory can cause permission and venv shadowing issues
    # when the container runs as a non-root user. Use root for local debugging.
    user: root
    restart: unless-stopped
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8000
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
